image: condaforge/mambaforge:latest

variables:
  CONDA_ENV_NAME: "ds-review"
  ENVIRONMENT_FILE: "environment-dev.yml"
  CONDA_LOCK_FILE: "conda-lock.yml"

stages:
  - package
  - test


build_image:
  stage: package
  image: quay.io/buildah/stable
  variables:
    # Use vfs with buildah. Docker offers overlayfs as a default, but Buildah
    # cannot stack overlayfs on top of another overlayfs filesystem.
    STORAGE_DRIVER: vfs
    # Write all image metadata in the docker format, not the standard OCI format.
    # Newer versions of docker can handle the OCI format, but older versions, like
    # the one shipped with Fedora 30, cannot handle the format.
    BUILDAH_FORMAT: docker
    FQ_IMAGE_NAME: "$CI_REGISTRY/$CI_PROJECT_PATH:$CI_COMMIT_REF_SLUG"
  before_script:
    # GitLab Container Registry credentials taken from the
    # [predefined CI/CD variables](../variables/index.md#predefined-cicd-variables)
    # to authenticate to the registry.
    - buildah login -u "$CI_REGISTRY_USER" -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - buildah images
    - buildah build -t $FQ_IMAGE_NAME -f app/app.dockerfile .
    - buildah images
    - buildah login -u "$CI_REGISTRY_USER" -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - buildah push $FQ_IMAGE_NAME


# create container and push it to the gitlab registry
.container:
  stage: package
  script:
    - echo "Creating container"


.test_stage_setup_script: &test_stage_setup_script
  - source /venv/bin/activate
  - cd app && chmod +x scripts/$SCRIPT_NAME

pytests:
  image:
    name: "$CI_REGISTRY/$CI_PROJECT_PATH:$CI_COMMIT_REF_SLUG"
    entrypoint: [ "" ]
  stage: test
  variables:
    SCRIPT_NAME: "run_tests.sh"
    COVERAGE_LIMIT_PERCENTAGE: "85"
  script:
    - *test_stage_setup_script
    - ./scripts/$SCRIPT_NAME -r -f $COVERAGE_LIMIT_PERCENTAGE
  artifacts:
    paths:
      - app/tests/coverage.xml
      - app/tests/coverage/

pylint:
  image:
    name: "$CI_REGISTRY/$CI_PROJECT_PATH:$CI_COMMIT_REF_SLUG"
    entrypoint: [""]
  stage: test
  variables:
    SCRIPT_NAME: "pylint.sh"
    PYLINT_LIMIT_SCORE: "9.0"
  script:
    - *test_stage_setup_script
    - ./scripts/$SCRIPT_NAME -f $PYLINT_LIMIT_SCORE | tee pylint_report.txt
  artifacts:
    paths:
      - app/pylint_report.txt
    when: always


mypy:
  image:
    name: "$CI_REGISTRY/$CI_PROJECT_PATH:$CI_COMMIT_REF_SLUG"
    entrypoint: [ "" ]
  stage: test
  variables:
    SCRIPT_NAME: "mypy.sh"
  script:
    - *test_stage_setup_script
    - ./scripts/$SCRIPT_NAME -h -x
  artifacts:
    paths:
      - app/mypy_report_html/
      - app/mypy_report_xml/
