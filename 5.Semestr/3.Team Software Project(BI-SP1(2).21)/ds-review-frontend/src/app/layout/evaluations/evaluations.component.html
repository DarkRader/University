<!-- evaluations.component.html -->

<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

  <!-- State Column -->
  <ng-container matColumnDef="state">
    <th mat-header-cell *matHeaderCellDef> State </th>
    <td mat-cell *matCellDef="let element"> {{element.state}} </td>
  </ng-container>

  <!-- Rating Column -->
  <ng-container matColumnDef="rating">
    <th mat-header-cell *matHeaderCellDef> Rating </th>
    <td mat-cell *matCellDef="let element"> {{element.rating}} </td>
  </ng-container>

  <!-- Document UUID Column -->
  <ng-container matColumnDef="document_uuid">
    <th mat-header-cell *matHeaderCellDef> Document UUID </th>
    <td mat-cell *matCellDef="let element"> {{element.document_uuid}} </td>
  </ng-container>

  <!-- Other columns can be added based on your API structure -->

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
