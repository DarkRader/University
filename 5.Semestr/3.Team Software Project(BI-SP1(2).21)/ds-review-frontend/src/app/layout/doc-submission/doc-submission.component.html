<div class="doc-submission">
  <form [formGroup]="documentForm" (ngSubmit)="onSubmit()" class="form-group">

    <!-- Left Column (takes 60% of the width) -->
    <div style="flex: 6;">

      <!-- Document Text Field -->
      <mat-form-field class="doc">
        <mat-label>Document Text</mat-label>
        <textarea matInput id="input_doc_text" formControlName="documentText"></textarea>
      </mat-form-field>

    </div>

    <div class="right-side">

      <!-- Card for dsr-token input and button -->
      <mat-card class="card-submit">

        <mat-card-header>
          <mat-card-title>Submit Document</mat-card-title>
        </mat-card-header>
        
        <mat-card-content >
          <mat-form-field>
            <mat-label>dsr-token</mat-label>
            <input matInput id="input_dsr_token" formControlName="dsrToken" style="width:100%">
          </mat-form-field>
        </mat-card-content>
        
        <mat-card-actions>
          <button mat-button id="btn_submit_doc" color="primary" type="submit">Submit Document</button>
        </mat-card-actions>

      </mat-card>

    </div>
  </form>
</div>
